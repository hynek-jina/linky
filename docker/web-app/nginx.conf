server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No SPA fallback. Routing is hash-based (`/#...`), so a `try_files ... /index.html`
    # catch-all is not needed — and it would be actively harmful: /api/link-preview and
    # /api/lnurlp are dev-plugin-only endpoints, so a catch-all would answer them with
    # HTML and a 200, which the callers then feed to JSON.parse.
    location / {
        try_files $uri $uri/ =404;
    }

    # Never serve a stale shell or WASM between test runs.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /sqlite-wasm/ {
        add_header Cache-Control "no-store";
    }
}
