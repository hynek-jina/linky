name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Vitest spawns real Node worker processes. Node >= 25 is where
      # globalThis.localStorage/sessionStorage shadow the ones jsdom would
      # install (repaired in apps/web-app/vitest.setup.ts). Pin the runner so
      # apps/web-app/src/utils/storage.environment.test.ts can actually fail
      # here instead of passing vacuously on a pre-v25 runner.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test
