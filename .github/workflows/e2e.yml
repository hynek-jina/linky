name: E2E

# Runs standalone on every push to main (Vercel Deployment Checks reads the
# `e2e` check to gate production promotion) and as a reusable job for the
# Android release workflows.
on:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web-app
        run: bunx playwright install --with-deps chromium

      - name: Start local stack
        run: docker compose -f docker-compose.dev.yml --profile e2e up -d --build --wait

      - name: Run e2e tests
        working-directory: apps/web-app
        env:
          E2E_SKIP_WEBSERVER: "1"
        run: bunx playwright test --project=local-stack

      - name: Dump service logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml --profile e2e logs

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: apps/web-app/test-results/
          retention-days: 7
