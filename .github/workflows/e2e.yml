name: E2E

# Runs standalone on every push to main (Vercel Deployment Checks reads the
# `e2e` check to gate production promotion) and as a reusable job for the
# Android release workflows.
on:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web-app
        run: pnpm exec playwright install --with-deps chromium

      - name: Start local stack
        run: docker compose -f docker-compose.dev.yml --profile e2e up -d --build --wait

      - name: Run e2e tests
        working-directory: apps/web-app
        env:
          E2E_SKIP_WEBSERVER: "1"
        run: pnpm exec playwright test --project=local-stack

      - name: Dump service logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml --profile e2e logs

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: apps/web-app/test-results/
          retention-days: 7
